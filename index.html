<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>홍대2026 · HONGDAE 2026</title>
<meta name="theme-color" content="#101016">
<meta name="description" content="홍대의 세 문화가 거리의 주도권을 두고 경쟁하는 오픈월드 액션·영역 점령 게임">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="panel-me">
    <div id="me-badge"></div>
    <div class="bar hp"><i id="hp-fill"></i><span id="hp-text"></span></div>
    <div class="bar st"><i id="st-fill"></i><span id="st-text"></span></div>
    <div id="me-info"></div>
  </div>
  <div id="panel-map">
    <canvas id="minimap" width="200" height="150"></canvas>
    <div id="score"></div>
  </div>
  <button id="btn-pause" aria-label="일시정지">⏸</button>
  <div id="toast"></div>
  <div id="ko" class="hidden">KO · 재정비 중…</div>
  <div id="actions">
    <button id="b-punch" class="act">주먹<small>J</small></button>
    <button id="b-kick" class="act">발차기<small>K</small></button>
    <button id="b-block" class="act">블록<small>L</small></button>
    <button id="b-spec" class="act spec"><span id="spec-name">특수</span><small>SPACE</small><i id="spec-cd"></i></button>
  </div>
  <div id="joy"><i id="knob"></i></div>
</div>

<div id="menu" class="screen">
  <div class="panel">
    <h1>홍대<b>2026</b></h1>
    <p class="sub">HONGDAE 2026 · 세 개의 문화, 하나의 거리</p>
    <h2>진영 · 캐릭터 선택</h2>
    <div id="faction-grid"></div>
    <h2>AI 난이도</h2>
    <div id="diff-box"></div>
    <label class="check"><input type="checkbox" id="spectate"> 관전 모드 (내 캐릭터도 AI가 조종)</label>
    <button id="btn-start" class="primary">게임 시작</button>
    <details class="help">
      <summary>조작법</summary>
      <p>이동 <b>WASD / 방향키</b> · 주먹 <b>J</b> · 발차기 <b>K</b> · 블록 <b>L / Shift</b> · 특수 기술 <b>Space</b> · 일시정지 <b>Esc</b><br>
      모바일: 왼쪽 조이스틱 + 오른쪽 버튼.<br>
      상점 입구에 서 있으면 점령하고, 음식점에서 스태미나를 회복합니다. 점령 가능 상점의 60%를 차지하면 승리!</p>
    </details>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="panel small">
    <h2>일시정지</h2>
    <div id="pause-diff"></div>
    <button id="btn-resume" class="primary">계속하기</button>
    <button id="btn-quit">메인 메뉴로</button>
  </div>
</div>

<div id="end" class="screen hidden">
  <div class="panel small">
    <h2 id="end-title"></h2>
    <p id="end-body"></p>
    <button id="btn-again" class="primary">다시 하기</button>
    <button id="btn-menu">메인 메뉴로</button>
  </div>
</div>

<script type="module" src="src/game.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
